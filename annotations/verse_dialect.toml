# Verse quotations and dialect passages in the Attic Prose Corpus
#
# These sections contain material that is NOT Attic prose:
# - verse: quoted poetry (Homer, Hesiod, tragedy, etc.)
# - dialect: non-Attic dialect passages (Doric, Ionic, etc.)
# - oracle: oracular pronouncements (often hexameter)
# - inscription: inscribed texts (may be verse or dialect)
# - document: formal documents (decrees, treaties, letters)
#
# Used by:
# - greek-check: skip accentuation rules that assume Attic prose
# - lemmatisation: tag tokens with register context
# - vocabulary analysis: distinguish Attic prose vocabulary from verse/dialect
#
# Sources: structural markers ({quote}, <l>, <quote type="verse">),
# cross-referenced with scholarly editions and secondary literature.

